<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCQ Answer Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        #faintAnswerBox {
            position: fixed;
            top: 20px;
            right: 24px;
            background: transparent;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            padding: 6px 10px;
            pointer-events: none;
            display: none;
            z-index: 999999;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            white-space: pre-wrap;
            max-width: 420px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="faintAnswerBox"></div>

    <script>
        const { ipcRenderer } = require('electron');

        let isVisible = false;
        let answerText = '';

        ipcRenderer.on('store-mcq-answers', (event, data) => {
            console.log('[Target Overlay] Stored MCQ answers:', data);
            answerText = data?.text || '';
            const box = document.getElementById('faintAnswerBox');
            if (box) {
                box.textContent = answerText;
            }
        });

        ipcRenderer.on('trigger-mcq-blink-targets', (event, data) => {
            console.log('[Target Overlay] Received MCQ targets:', data);
            const targets = data?.targets || [];
            if (targets.length > 0) {
                answerText = targets.map(t => `${t.q ? t.q + ': ' : ''}${t.option}`).join('  |  ');
                const box = document.getElementById('faintAnswerBox');
                if (box) {
                    box.textContent = answerText;
                }
            }
        });

        ipcRenderer.on('toggle-mcq-answers-overlay', () => {
            isVisible = !isVisible;
            const box = document.getElementById('faintAnswerBox');
            if (box) {
                box.style.display = isVisible ? 'block' : 'none';
            }
        });

        ipcRenderer.on('clear-mcq-targets', () => {
            answerText = '';
            isVisible = false;
            const box = document.getElementById('faintAnswerBox');
            if (box) {
                box.textContent = '';
                box.style.display = 'none';
            }
        });
    </script>
</body>
</html>
