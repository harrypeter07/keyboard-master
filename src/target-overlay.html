<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCQ Target Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }

        #targetsContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            pointer-events: none;
        }

        /* ── MCQ Blinking Target Pulse Dot Overlay ── */
        .mcq-target-dot {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00f2fe;
            box-shadow: 0 0 16px #00f2fe, 0 0 32px #e100ff, 0 0 50px #00f2fe;
            border: 2px solid #ffffff;
            z-index: 999999;
            pointer-events: none;
            animation: mcq-pulse 0.75s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
        }

        .mcq-target-badge {
            position: absolute;
            left: 26px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.94);
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.7);
            font-family: 'JetBrains Mono', monospace, sans-serif;
            pointer-events: none;
        }

        @keyframes mcq-pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.75;
                box-shadow: 0 0 10px #00f2fe, 0 0 20px #e100ff;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.6);
                opacity: 1;
                box-shadow: 0 0 35px #00f2fe, 0 0 60px #e100ff, 0 0 85px #00f2fe;
            }
        }
    </style>
</head>
<body>
    <div id="targetsContainer"></div>

    <script>
        const { ipcRenderer } = require('electron');

        let dismissTimeout = null;

        ipcRenderer.on('trigger-mcq-blink-targets', (event, data) => {
            console.log('[Target Overlay] Received MCQ targets:', data);
            const targets = data?.targets || [];
            const container = document.getElementById('targetsContainer');
            container.innerHTML = '';

            if (targets.length === 0) return;

            targets.forEach(t => {
                const dot = document.createElement('div');
                dot.className = 'mcq-target-dot';
                dot.style.top = `${t.top}%`;
                dot.style.left = `${t.left || 28}%`;

                const badge = document.createElement('span');
                badge.className = 'mcq-target-badge';
                badge.textContent = t.q ? `${t.q}: ${t.option}` : t.option;
                dot.appendChild(badge);

                container.appendChild(dot);
            });

            clearTimeout(dismissTimeout);
            dismissTimeout = setTimeout(() => {
                container.innerHTML = '';
            }, 10000);
        });

        ipcRenderer.on('clear-mcq-targets', () => {
            const container = document.getElementById('targetsContainer');
            if (container) container.innerHTML = '';
        });
    </script>
</body>
</html>
