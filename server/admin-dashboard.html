<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Master Admin Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Lighter Cream + Dark Pink + Lavender Palette */
            --bg: #FAF6F0;
            --surface: #FFFFFF;
            --surface-hover: #F8F3EC;
            --border: #EFE6DA;
            
            --dark-pink: #BE185D;
            --dark-pink-hover: #9D174D;
            --pink-glow: rgba(190, 24, 93, 0.22);
            
            --lavender: #7E22CE;
            --lavender-light: #A5B4FC;
            --lavender-glow: rgba(126, 34, 206, 0.18);
            
            --primary: #BE185D;
            --primary-glow: rgba(190, 24, 93, 0.25);
            --accent: #7E22CE;
            
            --danger: #DC2626;
            --success: #059669;
            --warning: #D97706;
            
            --text: #1F1528;
            --muted: #6B587B;
            
            --card-shadow: 0 10px 30px rgba(126, 34, 206, 0.06), 0 2px 8px rgba(190, 24, 93, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            background: rgba(255, 253, 249, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--dark-pink), var(--lavender));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Container ── */
        .container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        /* ── Auth Screen ── */
        .auth-card {
            max-width: 400px;
            margin: 5rem auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #FFFDF9;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--dark-pink);
            box-shadow: 0 0 12px var(--pink-glow);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--dark-pink), var(--lavender));
            color: white;
            width: 100%;
            box-shadow: 0 8px 20px var(--pink-glow);
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 12px 28px var(--lavender-glow);
            transform: translateY(-1px);
        }

        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        /* ── Grid & Stats ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--dark-pink), var(--lavender));
        }

        .stat-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        .stat-value { font-size: 2rem; font-weight: 800; margin-top: 0.5rem; color: var(--text); }

        /* ── Section Cards & Tables ── */
        .section-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .section-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #FAF6F0;
            padding: 0.9rem 1rem;
            color: var(--muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:hover td { background: var(--surface-hover); }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-success { background: rgba(5, 150, 105, 0.12); color: var(--success); }
        .badge-danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .badge-warning { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .badge-primary { background: rgba(190, 24, 93, 0.12); color: var(--dark-pink); }

        .hidden { display: none !important; }
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <img src="/logo.png" alt="Keyboard Master Logo" style="width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(190, 24, 93, 0.2);">
            Keyboard Master Admin
        </div>
        <button id="logoutBtn" class="btn btn-sm btn-danger hidden" onclick="logout()">Logout</button>
    </header>

    <div class="container">
        <!-- Auth View -->
        <div id="authView" class="auth-card">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="adminEmail" class="form-control" placeholder="Enter admin email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="••••••••">
            </div>
            <button id="loginBtn" class="btn btn-primary" onclick="loginAdmin()">Sign In to Dashboard</button>

            <!-- Google OAuth SSO Option -->
            <div style="display: flex; align-items: center; gap: 10px; margin: 1.2rem 0; color: var(--muted); font-size: 0.8rem;">
                <div style="flex: 1; height: 1px; background: var(--border);"></div>
                <span>OR</span>
                <div style="flex: 1; height: 1px; background: var(--border);"></div>
            </div>

            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleGoogleAdminCallback"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="pill"
                 data-logo_alignment="left"
                 style="width: 100%; display: flex; justify-content: center;">
            </div>

            <div id="authError" style="color: var(--danger); font-size: 0.85rem; margin-top: 1rem; text-align: center;"></div>
        </div>

        <!-- Main Dashboard View -->
        <div id="dashView" class="hidden">
            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="statUsers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Instances</div>
                    <div class="stat-value" id="statInstances">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Paid Subscriptions</div>
                    <div class="stat-value" id="statPaid">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Banned Users</div>
                    <div class="stat-value" id="statBanned">0</div>
                </div>
            </div>

            <!-- Pricing & Cloud API Key Configuration -->
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">Pricing & Server API Settings</div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>Weekly Plan Price ($ USD)</label>
                        <input type="number" step="0.01" id="weeklyPrice" class="form-control" value="9.99">
                    </div>
                    <div class="form-group">
                        <label>Monthly Plan Price ($ USD)</label>
                        <input type="number" step="0.01" id="monthlyPrice" class="form-control" value="29.99">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Server Cloud Gemini API Key (For Paid Members)</label>
                        <input type="password" id="serverApiKey" class="form-control" placeholder="AQ.Ab8RN6...">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Live Installer Download URL (Google Drive / AWS S3 / Direct EXE Link)</label>
                        <input type="text" id="downloadUrl" class="form-control" placeholder="https://drive.google.com/uc?export=download&id=YOUR_FILE_ID">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Latest Released App Version (Bumps In-App Auto-Updater e.g. 0.8.0)</label>
                        <input type="text" id="latestVersion" class="form-control" placeholder="0.8.0">
                    </div>
                </div>
                <button class="btn btn-primary" style="width: auto; margin-top: 1rem;" onclick="savePricing()">Save Settings</button>
            </div>

            <!-- User Management Table -->
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">User Accounts & Subscriptions</div>
                </div>
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Cloud AI Access</th>
                            <th>Created IP</th>
                            <th>Last IP</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody><!-- Dynamic Users --></tbody>
                </table>
            </div>

            <!-- Active Instances Table -->
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">Live App Instances (Device Lockout)</div>
                </div>
                <table id="instancesTable">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Device ID</th>
                            <th>Platform</th>
                            <th>IP Address</th>
                            <th>Last Heartbeat</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody><!-- Dynamic Instances --></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem('km_admin_token') || '';

        if (adminToken) {
            loadDashboard();
        }

        async function loginAdmin() {
            const emailInput = document.getElementById('adminEmail');
            const passwordInput = document.getElementById('adminPassword');
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('authError');
            
            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';
            
            errorDiv.innerHTML = '';

            if (!email || !password) {
                errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Please enter both admin email and password.</div>';
                return;
            }

            // Show Loading State
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '⚡ Verifying Credentials...';
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    if (data.user.role === 'admin') {
                        adminToken = data.token;
                        localStorage.setItem('km_admin_token', adminToken);
                        if (loginBtn) loginBtn.innerHTML = '✓ Access Granted! Loading...';
                        await loadDashboard();
                    } else {
                        errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Access denied. Account does not have administrator privileges.</div>';
                        if (loginBtn) {
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = 'Sign In to Dashboard';
                        }
                    }
                } else {
                    errorDiv.innerHTML = `<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">${data.error || 'Admin login failed.'}</div>`;
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Sign In to Dashboard';
                    }
                }
            } catch (err) {
                errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Server connection error. Please try again.</div>';
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Sign In to Dashboard';
                }
            }
        }

        async function handleGoogleAdminCallback(response) {
            const errorDiv = document.getElementById('authError');
            errorDiv.innerHTML = '<div style="color: var(--dark-pink); text-align: center;">⚡ Verifying Google OAuth Token...</div>';

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();
                if (data.success && data.user.role === 'admin') {
                    adminToken = data.token;
                    localStorage.setItem('km_admin_token', adminToken);
                    await loadDashboard();
                } else if (data.success) {
                    errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Google authentication successful, but this Google account is not configured with administrator privileges.</div>';
                } else {
                    errorDiv.innerHTML = `<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">${data.error || 'Google login failed.'}</div>`;
                }
            } catch (err) {
                errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Network error during Google authentication.</div>';
            }
        }

        function logout() {
            localStorage.removeItem('km_admin_token');
            location.reload();
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const data = await res.json();

                if (!data.success) {
                    const errorDiv = document.getElementById('authError');
                    if (errorDiv) {
                        errorDiv.innerHTML = `<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Session error: ${data.error || 'Please login again.'}</div>`;
                    }
                    localStorage.removeItem('km_admin_token');
                    adminToken = '';
                    document.getElementById('authView').classList.remove('hidden');
                    document.getElementById('dashView').classList.add('hidden');
                    document.getElementById('logoutBtn').classList.add('hidden');
                    const loginBtn = document.getElementById('loginBtn');
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Sign In to Dashboard';
                    }
                    return;
                }

                // Show Dashboard View
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashView').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');

                const users = data.users || [];
                const instances = data.instances || [];
                const pricing = data.pricing || {};

                // Update Stats
                document.getElementById('statUsers').innerText = users.length;
                document.getElementById('statInstances').innerText = instances.filter(i => i.status === 'active').length;
                document.getElementById('statPaid').innerText = users.filter(u => u.plan !== 'free').length;
                document.getElementById('statBanned').innerText = users.filter(u => u.isBanned).length;

                // Update Pricing
                if (document.getElementById('weeklyPrice')) document.getElementById('weeklyPrice').value = pricing.weeklyPriceUsd || 9.99;
                if (document.getElementById('monthlyPrice')) document.getElementById('monthlyPrice').value = pricing.monthlyPriceUsd || 29.99;
                if (document.getElementById('serverApiKey')) document.getElementById('serverApiKey').value = pricing.serverGeminiApiKey || '';
                if (document.getElementById('downloadUrl')) document.getElementById('downloadUrl').value = pricing.downloadUrl || '';
                if (document.getElementById('latestVersion')) document.getElementById('latestVersion').value = pricing.latestVersion || '0.8.0';

                // Render Users Table
                const uTbody = document.querySelector('#usersTable tbody');
                if (uTbody) {
                    uTbody.innerHTML = users.map(u => `
                        <tr>
                            <td>${u.email}</td>
                            <td><span class="badge ${u.plan === 'free' ? 'badge-warning' : 'badge-primary'}">${u.plan}</span></td>
                            <td><span class="badge ${u.isBanned ? 'badge-danger' : 'badge-success'}">${u.isBanned ? 'Banned' : 'Active'}</span></td>
                            <td>${u.cloudApiAccess ? '✅ Enabled' : '❌ Disabled'}</td>
                            <td>${u.createdIp || '-'}</td>
                            <td>${u.lastIp || '-'}</td>
                            <td>
                                <button class="btn btn-sm ${u.isBanned ? 'btn-success' : 'btn-danger'}" onclick="toggleBan('${u._id}', ${!u.isBanned})">
                                    ${u.isBanned ? 'Unban' : 'Ban User'}
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="promptPlan('${u._id}', '${u.plan}')">Change Plan</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Render Instances Table
                const iTbody = document.querySelector('#instancesTable tbody');
                if (iTbody) {
                    iTbody.innerHTML = instances.map(i => `
                        <tr>
                            <td>${i.userId?.email || 'Unknown'}</td>
                            <td><code>${i.deviceId}</code></td>
                            <td>${i.platform}</td>
                            <td>${i.ipAddress || '-'}</td>
                            <td>${i.lastHeartbeat ? new Date(i.lastHeartbeat).toLocaleString() : '-'}</td>
                            <td><span class="badge ${i.status === 'active' ? 'badge-success' : 'badge-danger'}">${i.status}</span></td>
                            <td>
                                ${i.status === 'active' ? `<button class="btn btn-sm btn-danger" onclick="killInstance('${i._id}')">Kill Remote App</button>` : 'Disabled'}
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading dashboard:', err);
                const errorDiv = document.getElementById('authError');
                if (errorDiv) {
                    errorDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px;">Network or database connection error while loading dashboard.</div>';
                }
            }
        }

        async function toggleBan(userId, isBanned) {
            const reason = isBanned ? prompt('Enter reason for ban:', 'Violation of Terms & Conditions') : '';
            if (isBanned && reason === null) return;

            await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify({ userId, isBanned, banReason: reason })
            });
            loadDashboard();
        }

        async function promptPlan(userId, currentPlan) {
            const newPlan = prompt('Enter new plan (free, weekly, monthly):', currentPlan);
            if (!newPlan) return;
            const enableCloud = confirm('Enable Server Cloud API Access for this user?');

            await fetch('/api/admin/update-plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify({ userId, plan: newPlan, cloudApiAccess: enableCloud })
            });
            loadDashboard();
        }

        async function killInstance(instanceId) {
            if (!confirm('Remotely terminate this running application instance?')) return;
            await fetch('/api/admin/kill-instance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify({ instanceId })
            });
            loadDashboard();
        }

        async function savePricing() {
            const weeklyPriceUsd = parseFloat(document.getElementById('weeklyPrice').value);
            const monthlyPriceUsd = parseFloat(document.getElementById('monthlyPrice').value);
            const serverGeminiApiKey = document.getElementById('serverApiKey').value;
            const downloadUrl = document.getElementById('downloadUrl').value;
            const latestVersion = document.getElementById('latestVersion').value;

            await fetch('/api/admin/pricing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
                body: JSON.stringify({ weeklyPriceUsd, monthlyPriceUsd, serverGeminiApiKey, downloadUrl, latestVersion })
            });
            alert('Settings updated successfully!');
            loadDashboard();
        }
    </script>
</body>
</html>
